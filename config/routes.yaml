# This file defines page routes for https://kaskoconstruction.com.

################
# PAGES        #
################

# Home
home:
    path: /
    controller: Kasko\Controller\DefaultController::getHome
    methods: GET
# FAQ
frequently-asked-questions:
    path: /faq
    controller: Kasko\Controller\DefaultController::getFaq
    methods: GET
# About
about-us:
    path: /about
    controller: Kasko\Controller\DefaultController::getAbout
    methods: GET
# Contact
contact:
    path: /contact
    controller: Kasko\Controller\DefaultController::getContact
    methods: GET
# Fencing — Google Ads landing page (default/general)
fencing:
    path: /fencing
    controller: Kasko\Controller\DefaultController::getFencing
    methods: GET
# Fencing — variant landing pages. The `type` requirement is a strict
# whitelist so /fencing/garbage returns 404 rather than rendering the
# default page. Adding a new variant means updating both this regex
# and the $heroVariants map in DefaultController::getFencing.
fencing_variant:
    path: /fencing/{type}
    controller: Kasko\Controller\DefaultController::getFencing
    methods: GET
    requirements:
        type: 'privacy|wood|chain-link|repair'
# Terms of Service
terms-of-service:
    path: /terms-of-service
    controller: Kasko\Controller\DefaultController::getTermsOfService
    methods: GET
# Privacy Policy
privacy-policy:
    path: /privacy-policy
    controller: Kasko\Controller\DefaultController::getPrivacyPolicy
    methods: GET

# SEO Controller

# Sitemap
get_sitemap:
    path: /sitemap
    controller: Kasko\Controller\SeoController::getSitemapXml
    methods: GET
# Redirect {.xml} to /sitemap
get_sitemap_xml:
    path: /sitemap.xml
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::urlRedirectAction
    methods: GET
    defaults:
        path: /sitemap
        permanent: true
