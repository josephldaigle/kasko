# This file defines page routes for https://cleangutterco.com.

################
# PAGES        #
################

# Home
home:
    path: /
    controller: Kasko\Controller\DefaultController::getHome
    methods: GET
# FAQ
frequently-asked-questions:
    path: /commonly-asked-gutter-questions
    controller: Kasko\Controller\DefaultController::getFaq
    methods: GET
# About
about-us:
    path: /about-clean-gutter-co
    controller: Kasko\Controller\DefaultController::getAbout
    methods: GET
# Contact
contact:
    path: /contact-clean-gutter-co
    controller: Kasko\Controller\DefaultController::getContact
    methods: GET
# Terms of Service
terms-of-service:
    path: /terms-of-service
    controller: Kasko\Controller\DefaultController::getTermsOfService
    methods: GET
# Privacy Policy
privacy-policy:
    path: /privacy-policy
    controller: Kasko\Controller\DefaultController::getPrivacyPolicy
    methods: GET

# SEO Controller

# Sitemap
get_sitemap:
    path: /sitemap
    controller: Kasko\Controller\SeoController::getSitemapXml
    methods: GET
# Redirect {.xml} to /sitemap
get_sitemap_xml:
    path: /sitemap.xml
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::urlRedirectAction
    methods: GET
    defaults:
        path: /sitemap
        permanent: true

# Marketing

# This route MUST be after all pages defined in it's `condition` property
location_landing-page:
    path: /gutter-cleaning/{location}
    controller: Kasko\Controller\DefaultController::getLandingPage
    condition: 'request.getPathInfo() matches "/gutter-cleaning\\\\|macon|perry|byron|warner-robins|fort-valley/"'
    methods: GET

