# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
imports:
    - { resource: services/quickbooks.yaml }

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    locale: 'en'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Every ReviewProviderInterface implementation is auto-tagged
    # `app.review_provider` here so SyncReviewsCommand picks it up
    # via a tagged iterator. Adding a second provider (Yelp,
    # Facebook) requires only a new class under
    # src/Services/Reviews/ — no further wiring here.
    _instanceof:
        Kasko\Services\Reviews\ReviewProviderInterface:
            tags: ['app.review_provider']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    Kasko\:
        resource: '../src/*'
        exclude: '../src/{CMS,DependencyInjection,Entity,Http/Event/KernelRequestSubscriber.php,Migrations,Services/TemplateData/HtmlPageDataCompiler.php,Tests,Kernel.php}'

    # controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    Kasko\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    Kasko\Services\TemplateData\HtmlPageDataCompiler:
        class: Kasko\Services\TemplateData\HtmlPageDataCompiler
        arguments:
            $cms: '@Kasko\CMS\CMS'
#            $containerParams:
#                google_place_api_key: '%google_place_api_key%'

    Kasko\Http\Event\KernelRequestSubscriber:
        class: Kasko\Http\Event\KernelRequestSubscriber
        arguments:
            $logger: '@logger'
            $securityService: '@security.csrf.token_manager'
            $templateDataProviders: ['@Kasko\Services\TemplateData\HtmlPageDataCompiler']

    # ------------------------------------------------------------------
    # Reviews sync — Google Business Profile v4
    # ------------------------------------------------------------------
    Kasko\Services\Reviews\Google\GoogleOAuthClient:
        arguments:
            $clientId:     '%env(string:GOOGLE_OAUTH_CLIENT_ID)%'
            $clientSecret: '%env(string:GOOGLE_OAUTH_CLIENT_SECRET)%'
            $refreshToken: '%env(string:GOOGLE_OAUTH_REFRESH_TOKEN)%'

    Kasko\Services\Reviews\Google\GoogleReviewsProvider:
        arguments:
            $accountId:          '%env(string:GOOGLE_BUSINESS_ACCOUNT_ID)%'
            $locationId:         '%env(string:GOOGLE_BUSINESS_LOCATION_ID)%'
            $businessReviewsUrl: '%env(string:GOOGLE_BUSINESS_REVIEWS_URL)%'

    Kasko\Command\SyncReviewsCommand:
        arguments:
            $providers: !tagged_iterator app.review_provider
