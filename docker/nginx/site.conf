# Kasko site nginx config.
#
# Four hostnames route through this config:
#   kaskoconstruction.com       (canonical)             → serves the app
#   www.kaskoconstruction.com   (canonicalize)          → 301 https://kaskoconstruction.com
#   kaskomaintenance.com        (secondary brand)       → 301 https://kaskoconstruction.com
#   www.kaskomaintenance.com    (secondary brand, www)  → 301 https://kaskoconstruction.com
#
# All four HTTPS server blocks reference a single Let's Encrypt
# certificate at /etc/letsencrypt/live/kaskoconstruction.com/. That
# certificate MUST be issued with all four hostnames as SANs; e.g.:
#
#   certbot --cert-name kaskoconstruction.com \
#       -d kaskoconstruction.com \
#       -d www.kaskoconstruction.com \
#       -d kaskomaintenance.com \
#       -d www.kaskomaintenance.com
#
# Certbot is expected to run on the deploy host (not in this stack);
# nginx mounts /etc/letsencrypt read-only.

# --------------------------------------------------------------------
# HTTP → HTTPS canonical for every hostname
# --------------------------------------------------------------------
server {
    listen 80;
    server_name
        kaskoconstruction.com
        www.kaskoconstruction.com
        kaskomaintenance.com
        www.kaskomaintenance.com;

    return 301 https://kaskoconstruction.com$request_uri;
}

# --------------------------------------------------------------------
# HTTPS 301 → canonical for every non-canonical hostname
# --------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name
        www.kaskoconstruction.com
        kaskomaintenance.com
        www.kaskomaintenance.com;

    ssl_certificate /etc/letsencrypt/live/kaskoconstruction.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaskoconstruction.com/privkey.pem;

    return 301 https://kaskoconstruction.com$request_uri;
}

# --------------------------------------------------------------------
# HTTPS canonical origin — serves the app
# --------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name kaskoconstruction.com;

    ssl_certificate /etc/letsencrypt/live/kaskoconstruction.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaskoconstruction.com/privkey.pem;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_SSL on;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 120;

        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
