server {
    listen 80;
    server_name
        kaskoconstruction.com
        www.kaskoconstruction.com
        kaskomaintenance.com
        www.kaskomaintenance.com;

    return 301 https://kaskoconstruction.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.kaskoconstruction.com;

    ssl_certificate /etc/letsencrypt/live/kaskoconstruction.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaskoconstruction.com/privkey.pem;

    return 301 https://kaskoconstruction.com$request_uri;
}

server {
    listen 443 ssl;
    server_name
        kaskomaintenance.com
        www.kaskomaintenance.com;

    ssl_certificate /etc/letsencrypt/live/kaskoconstruction.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaskoconstruction.com/privkey.pem;

    return 301 https://kaskoconstruction.com$request_uri;
}

server {
    listen 443 ssl;
    server_name kaskoconstruction.com;

    ssl_certificate /etc/letsencrypt/live/kaskoconstruction.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaskoconstruction.com/privkey.pem;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_SSL on;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 120;

        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
